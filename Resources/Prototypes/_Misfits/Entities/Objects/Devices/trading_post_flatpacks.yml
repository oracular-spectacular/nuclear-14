# Trading Post Kit — a flatpack that unfolds into a wooden counter, the centrepiece of a player-run
# shop, trading post, shrine or mercenary front. Identity comes from dressing the counter, not from
# the structure: the fork already ships a bazaar sign (N14SignBazaarOn) and a bazaar flag
# (NCFlagWallBazaar) for exactly that.
#
# A Flatpack unfolds ONE entity, so the kit deploys the counter and the sign/flag are placed
# separately. We deploy the existing N14TableCounter rather than a near-duplicate of our own —
# reuse over a new prototype.
#
# Mirrors _Misfits/Entities/Objects/Devices/eighties_flatpacks.yml (the fork's proven pattern).

- type: entity
  parent: BaseFlatpack
  id: MisfitsTradingPostKitFlatpack
  name: trading post kit
  description: A flatpack that unfolds into a shop counter. Set it down, hang a sign and a flag, and you're open for business.
  components:
  - type: Flatpack
    entity: N14TableCounter
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#8a5a2b"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: StaticPrice
    price: 800

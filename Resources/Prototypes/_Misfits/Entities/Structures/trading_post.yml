# Trading Post Shell — the structure a TradingPostKit flatpack unfolds onto a prepared pad.
#
# v1 groundwork (Claude/Opus, 2026-09-07): a wood-frame counter core that reuses the existing
# CounterWoodFrame. A flatpack deploys ONE entity, so the counter is the signature piece; the
# shutter (ShuttersNormal / N14DoorShutterRoller), banner (BannerBase + colour/faction variants)
# and sign are placed separately as dressing — that is what makes one shell read as shop / shrine /
# merc front.
#
# TODO(astra): decide whether to promote this to a multitile composite "stall" entity (needs its own
# sprite + fixtures) or keep it a single counter core. Either way, verify in-game before PR.
# See docs/TRADING-POST-SHELL.md (this project) — Open decisions.

- type: entity
  parent: CounterWoodFrame
  id: MisfitsTradingPostCounter
  name: trading post counter
  description: A sturdy market counter. Throw a banner and a sign on it and you're open for business.
  suffix: Trading Post

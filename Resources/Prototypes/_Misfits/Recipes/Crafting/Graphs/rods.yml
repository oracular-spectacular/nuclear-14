#Misfits Add: metal rods from steel scrap and scrap (misfits-server#67)
- type: constructionGraph
  id: MisfitsMetalRodScrap
  start: start
  graph:
    - node: start
      edges:
        - to: rodFromSteelScrap
          steps:
            - material: N14ScrapSteel
              amount: 2
        - to: rodFromScrap
          steps:
